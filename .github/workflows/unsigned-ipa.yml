# Builds an unsigned Code.ipa from this repository and publishes it as a GitHub
# Release, so the latest version can be installed with a sideloading tool
# (AltStore, SideStore, Sideloadly, TrollStore, ...). Unlike build.yml and
# production.yml it needs no Apple developer account and no repository secrets.
#
# Runs on every push to main (for example after "Sync fork") and can also be
# started by hand from the Actions tab with "Run workflow".
name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

# The upstream workflows use `github.ref` as their concurrency group, and groups
# are shared by every workflow in the repository. Use a separate group so this
# build and the TestFlight build never cancel each other.
concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the release and upload the IPA

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      XCODE_PATH: /Applications/Xcode_26.2.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          else
            echo "::warning::$XCODE_PATH is not installed on this runner, using the default Xcode."
          fi
          xcodebuild -version

      - name: Download frameworks
        run: ./downloadFrameworks.sh

      - name: Build app (code signing disabled)
        run: |
          formatter="cat"
          if command -v xcbeautify > /dev/null; then
            formatter="xcbeautify"
          fi
          xcodebuild archive \
            -project Code.xcodeproj \
            -scheme "Code App" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Code.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | "$formatter"

      - name: Package IPA
        id: package
        run: |
          app="$RUNNER_TEMP/Code.xcarchive/Products/Applications/Code.app"
          if [ ! -f "$app/Info.plist" ]; then
            echo "::error::Code.app was not found in the archive."
            find "$RUNNER_TEMP/Code.xcarchive/Products" -maxdepth 3
            exit 1
          fi
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Info.plist")

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          mv "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry -X "$GITHUB_WORKSPACE/Code.ipa" Payload)
          ls -lh Code.ipa

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Code-${{ steps.package.outputs.version }}-unsigned-ipa
          path: Code.ipa
          compression-level: 0 # an IPA is already a zip file
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          tag="$VERSION-$short_sha"
          cat > "$RUNNER_TEMP/notes.md" << EOF
          Unsigned build of Code App $VERSION (build $BUILD) from commit $GITHUB_SHA.

          This IPA is not signed. Install it with a tool that signs it for your device, such as AltStore, SideStore, Sideloadly or TrollStore.

          Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          if gh release view "$tag" > /dev/null 2>&1; then
            # Same commit built again: replace the IPA in the existing release.
            gh release upload "$tag" Code.ipa --clobber
          else
            gh release create "$tag" Code.ipa \
              --target "$GITHUB_SHA" \
              --title "Code App $VERSION ($short_sha)" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi
